<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLM-ARM 轻量交互Demo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-robot me-2"></i>VLM-ARM 具身智能交互Demo
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text" id="taskStatus">
                    <i class="bi bi-circle text-secondary"></i> 等待任务
                </span>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- 左侧：图像和检测结果 -->
            <div class="col-lg-6">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-camera me-2"></i>相机图像
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="imagePreview" class="image-placeholder border rounded d-flex align-items-center justify-center bg-light">
                            <div class="text-center text-muted">
                                <i class="bi bi-image display-4"></i>
                                <p class="mt-2">上传图像或使用相机</p>
                            </div>
                        </div>
                        <div class="mt-3">
                            <input type="file" id="imageInput" accept="image/*" class="d-none">
                            <div class="d-grid gap-2">
                                <button class="btn btn-outline-primary" onclick="document.getElementById('imageInput').click()">
                                    <i class="bi bi-upload me-2"></i>上传图像
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 检测结果 -->
                <div class="card shadow-sm mb-4" id="detectionCard" style="display: none;">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-search me-2"></i>检测结果
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="detectionSummary" class="alert alert-info mb-3"></div>
                        <div id="detectionList" class="list-group"></div>
                    </div>
                </div>
            </div>

            <!-- 右侧：对话和控制 -->
            <div class="col-lg-6">
                <!-- 任务输入 -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-chat-dots me-2"></i>下达任务
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <textarea id="taskInput" class="form-control" rows="3" 
                                      placeholder="请用自然语言描述任务，例如：把红色方块放到蓝色盘子上..."></textarea>
                        </div>
                        <div class="d-grid gap-2">
                            <button id="analyzeBtn" class="btn btn-primary" onclick="analyzeTask()" disabled>
                                <i class="bi bi-lightning me-2"></i>分析任务
                            </button>
                        </div>
                        <div class="mt-3">
                            <small class="text-muted">提示：示例指令 - "把绿色方块放在小猪佩奇上"、"检查桌面上有什么物品"</small>
                        </div>
                    </div>
                </div>

                <!-- 执行计划 -->
                <div class="card shadow-sm mb-4" id="planCard" style="display: none;">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-list-check me-2"></i>执行计划
                        </h5>
                        <span id="planStatus" class="badge bg-secondary">待确认</span>
                    </div>
                    <div class="card-body">
                        <div id="planSummary" class="alert alert-success mb-3"></div>
                        
                        <h6 class="mb-2">关键帧序列：</h6>
                        <div id="keyframesList" class="mb-3" style="max-height: 300px; overflow-y: auto;"></div>

                        <div class="d-grid gap-2">
                            <button id="confirmBtn" class="btn btn-success" onclick="executeAction('confirm')">
                                <i class="bi bi-check-circle me-2"></i>确认执行
                            </button>
                            <div class="row">
                                <div class="col">
                                    <button id="retryBtn" class="btn btn-warning w-100" onclick="executeAction('retry')">
                                        <i class="bi bi-arrow-repeat me-2"></i>重新规划
                                    </button>
                                </div>
                                <div class="col">
                                    <button id="cancelBtn" class="btn btn-danger w-100" onclick="executeAction('cancel')">
                                        <i class="bi bi-x-circle me-2"></i>取消
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 导出按钮 -->
                <div class="card shadow-sm mb-4" id="exportCard" style="display: none;">
                    <div class="card-body">
                        <button class="btn btn-outline-primary w-100" onclick="exportTask()">
                            <i class="bi bi-download me-2"></i>导出任务记录（轨迹+对话）
                        </button>
                    </div>
                </div>

                <!-- 对话历史 -->
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-clock-history me-2"></i>对话历史
                        </h5>
                    </div>
                    <div class="card-body" style="max-height: 400px; overflow-y: auto;">
                        <div id="chatHistory" class="chat-container">
                            <div class="text-center text-muted py-4">
                                <i class="bi bi-chat display-6"></i>
                                <p class="mt-2">开始新任务</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 模态框：执行进度 -->
    <div class="modal fade" id="executionModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">执行中...</h5>
                </div>
                <div class="modal-body">
                    <div class="text-center">
                        <div class="spinner-border text-primary mb-3" role="status"></div>
                        <p id="executionText">正在执行任务...</p>
                    </div>
                    <div class="progress mt-3">
                        <div id="executionProgress" class="progress-bar" role="progressbar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
